<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Planner</title>
<meta name="description" content="Plan a trip day by day — ideas, restaurants and links on a route.">
<meta name="theme-color" content="#E7EBE4">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ============ mobile first ============ */
:root{
  --ink:#16233B; --ink2:#5A6870; --paper:#E7EBE4; --card:#FCFDFA;
  --rule:#CBD3C8; --line:#1F7A8C; --warn:#A32B1C;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); min-height:100vh;
  font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button{font-family:inherit;}
.wrap{padding:calc(14px + env(safe-area-inset-top)) 14px 108px;}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink2);margin:0;}

/* ---- header ---- */
.topbar{display:flex;align-items:flex-start;gap:10px;}
.topbar-main{flex:1;min-width:0;}
.name{width:100%;border:0;background:transparent;color:var(--ink);font-family:inherit;
  font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;padding:2px 0;margin:4px 0 0;}
.name::placeholder{color:#A8B2A6;}
.tripline{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);margin:4px 0 0;
  line-height:1.6;}
.gear{flex:0 0 auto;width:46px;height:46px;border-radius:8px;border:1.5px solid var(--rule);
  background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;margin-top:6px;}
.gear:active{background:#E2E7DE;}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;
  vertical-align:middle;background:var(--ink2);}
.syncdot[data-s="ok"]{background:#3F7D3A;}
.syncdot[data-s="busy"]{background:#C77400;}
.syncdot[data-s="err"]{background:var(--warn);}
.syncdot[data-s="off"]{background:#B4BDB2;}

/* ---- buttons ---- */
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:0 14px;min-height:48px;border-radius:8px;white-space:nowrap;}
.btn:active{background:#25365A;}
.btn[disabled]{opacity:.35;}
.btn.ghost{background:var(--card);color:var(--ink2);border-color:var(--rule);}
.btn.ghost:active{background:#E2E7DE;color:var(--ink);}
.cta{width:100%;min-height:52px;font-size:13px;}

/* ---- day strip ---- */
.strip-outer{margin:16px -14px 0;padding:0 14px 4px;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;touch-action:pan-x pan-y;}
.strip-outer::-webkit-scrollbar{display:none;}
.strip{position:relative;display:flex;width:max-content;padding:14px 0 6px;}
.strip::before{content:'';position:absolute;left:16px;right:16px;top:20px;height:2px;background:var(--rule);}
.stop{position:relative;background:transparent;border:0;cursor:pointer;padding:0 8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:8px;min-width:64px;scroll-snap-align:center;}
.dot{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--rule);background:var(--card);
  box-shadow:0 0 0 5px var(--paper);}
.stop[data-active="true"] .dot{transform:scale(1.35);}
.stop-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);white-space:nowrap;
  text-align:center;line-height:1.45;}
.stop[data-active="true"] .stop-label{color:var(--ink);font-weight:600;}
.stop-count{display:block;font-size:9px;opacity:.75;}

/* ---- tabs ---- */
.tabs{display:flex;gap:8px;margin-top:16px;}
.tab{flex:1;min-height:46px;border-radius:8px;border:1.5px solid var(--rule);background:var(--card);
  color:var(--ink2);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;padding:0 6px;}
.tab[data-on="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ---- panes ---- */
.cols{margin-top:18px;}
.pane[data-hidden="true"]{display:none;}
.colhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:14px;}
.colhead h2{margin:0;font-size:15px;font-weight:700;}

/* ---- days ---- */
.day{margin-bottom:26px;scroll-margin-top:10px;}
.dayhead{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap;}
.daynum{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;
  color:var(--card);background:var(--line);padding:4px 8px;border-radius:3px;}
.daydate{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);}
.track{position:relative;padding-left:26px;}
.track::before{content:'';position:absolute;left:5px;top:6px;bottom:26px;width:2px;
  background:var(--line);opacity:.35;}
.band{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink2);margin:13px 0 6px;}
.band:first-child{margin-top:0;}
.addhere{width:100%;min-height:46px;margin-top:8px;border:1.5px dashed var(--rule);background:transparent;
  border-radius:8px;color:var(--ink2);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;
  padding:0 8px;}
.addhere:active{background:#E2E7DE;color:var(--ink);}

/* ---- items ---- */
.item{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:9px;
  margin-bottom:9px;}
.item-main{display:flex;align-items:flex-start;gap:8px;width:100%;background:none;border:0;
  text-align:left;padding:12px 11px;cursor:pointer;color:inherit;}
.node{position:absolute;left:-26px;top:15px;width:13px;height:13px;background:var(--card);
  border:2.5px solid var(--line);box-shadow:0 0 0 4px var(--paper);}
.node.circle{border-radius:50%;}
.node.square{border-radius:2px;}
.node.diamond{border-radius:2px;transform:rotate(45deg);}
.node.bar{height:7px;top:18px;border-radius:5px;}
.node[data-booked="true"]{background:var(--line);}
.item-title{font-size:16px;font-weight:500;line-height:1.35;word-break:break-word;
  overflow-wrap:anywhere;display:block;}
.sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);margin-top:4px;
  display:block;overflow-wrap:anywhere;}
.note{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.45;overflow-wrap:anywhere;}
.caret{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink2);padding-top:4px;}
.panel{border-top:1px solid var(--rule);padding:11px;display:flex;flex-direction:column;gap:12px;}
.panel-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink2);margin:0 0 7px;}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.actions button{min-height:46px;border-radius:8px;border:1.5px solid var(--rule);background:var(--card);
  color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;padding:0 6px;}
.actions button:active{background:#E2E7DE;}
.actions button[data-on="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.actions button[data-danger="true"]{color:var(--warn);border-color:#E2C4BE;}
.openlink{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink);
  text-decoration:underline;text-underline-offset:3px;padding:6px 0;overflow-wrap:anywhere;}

/* ---- pickers: wrap, never scroll sideways ---- */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px;}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px;}
.kindgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.pill{min-height:48px;padding:4px 6px;border-radius:8px;border:1.5px solid var(--rule);
  background:var(--card);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.3;text-align:center;}
.pill:active{background:#E2E7DE;}
.pill[data-on="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.pill small{font-size:9px;opacity:.75;display:block;}
.pilldot{width:7px;height:7px;border-radius:50%;margin-bottom:3px;}

.empty{border:1.5px dashed var(--rule);border-radius:8px;padding:13px;font-size:13px;color:var(--ink2);
  line-height:1.5;}

/* ---- dock ---- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 64%,rgba(231,235,228,0));}
.dock .btn{flex:1;}
.dock .btn.ghost{flex:0 0 auto;width:78px;padding:0;}

/* ---- sheet ---- */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(22,35,59,.5);display:flex;
  align-items:flex-end;justify-content:center;}
.sheet{background:var(--paper);width:100%;max-width:620px;border-radius:16px 16px 0 0;max-height:92vh;
  display:flex;flex-direction:column;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px;
  border-bottom:1px solid var(--rule);}
.sheet-head h3{margin:0;font-size:17px;font-weight:700;}
.x{border:0;background:transparent;color:var(--ink2);font-size:24px;line-height:1;width:46px;height:46px;
  cursor:pointer;}
.sheet-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:18px;
  -webkit-overflow-scrolling:touch;}
.sheet-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);
  background:var(--card);}
.bigin{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1.5px solid var(--rule);border-radius:8px;padding:13px 11px;}
.bigin::placeholder{color:#9AA69B;}
textarea.bigin{resize:vertical;min-height:66px;line-height:1.5;}
textarea.share{min-height:220px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;}
input.mono{font-family:'IBM Plex Mono',monospace;font-size:14px;}
.hint{font-size:12px;color:var(--ink2);line-height:1.5;margin:6px 0 0;}
.hint a{color:var(--ink);}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;}
.stepper button{width:56px;min-height:48px;border:0;background:transparent;color:var(--ink);
  font-size:20px;cursor:pointer;}
.stepper button:active{background:#E2E7DE;}
.stepper span{font-family:'IBM Plex Mono',monospace;font-size:15px;}

/* ---- toast ---- */
.toast{position:fixed;left:14px;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12px;
  padding:12px 14px;border-radius:9px;z-index:80;text-align:center;line-height:1.4;}

:focus-visible{outline:2px solid #6A4FD8;outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ============ larger screens ============ */
@media (min-width:840px){
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 40px;}
  .name{font-size:44px;}
  .tabs{display:none;}
  .dock{display:none;}
  .cols{display:grid;grid-template-columns:310px 1fr;gap:26px;align-items:start;margin-top:24px;}
  .pane[data-hidden="true"]{display:block;}
  .stop{min-width:84px;padding:0 12px 6px;}
  .backdrop{align-items:center;padding:20px;}
  .sheet{border-radius:12px;max-height:84vh;}
  .toast{left:auto;right:24px;bottom:24px;max-width:420px;}
  .desk-actions{display:flex;gap:8px;margin-top:14px;}
}
@media (max-width:839px){ .desk-actions{display:none;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script>
"use strict";

/* ============================ constants ============================ */
const KEY = "tripplan.v1";
const SYNC_KEY = "tripplan.sync";
const API = "https://api.jsonbin.io/v3";
const LINES = ["#1F7A8C","#6A4FD8","#B3306B","#3F7D3A","#C77400","#2B5FC4","#8C4A2F","#137D63"];
const KINDS = [
  {id:"see",  label:"See",  shape:"circle"},
  {id:"eat",  label:"Eat",  shape:"square"},
  {id:"stay", label:"Stay", shape:"diamond"},
  {id:"move", label:"Move", shape:"bar"}
];
const SLOTS = [
  {id:"morning",   label:"Morning"},
  {id:"afternoon", label:"Afternoon"},
  {id:"evening",   label:"Evening"},
  {id:"flex",      label:"Flexible"}
];
const TOMBSTONE_DAYS = 60;

/* ============================ state ============================ */
let state = {
  trip:{ name:"Lanzarote", startDate:"2026-08-15", dayCount:12, updatedAt:0 },
  items:[]
};
let sync = { key:"", bin:"", status:"off", lastSync:0, message:"" };
let ui = { pane:"route", activeDay:null, openId:null, confirmId:null };

function loadLocal(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p.trip) Object.assign(state.trip, p.trip);
      if(Array.isArray(p.items)) state.items = p.items;
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    if(raw) Object.assign(sync, JSON.parse(raw));
  }catch(e){}
  sync.status = sync.bin && sync.key ? "idle" : "off";
}
let saveTimer;
function saveLocal(push){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast("Couldn't save on this device — storage may be full."); }
    if(push !== false) schedulePush();
  }, 200);
}
function saveSync(){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch(e){}
}

/* ============================ helpers ============================ */
function h(tag, props, children){
  const el = document.createElement(tag);
  if(props){
    for(const k in props){
      const v = props[k];
      if(v === null || v === undefined || v === false) continue;
      if(k === "class") el.className = v;
      else if(k === "text") el.textContent = v;
      else if(k === "style" && typeof v === "object"){
        for(const p in v){
          if(p.slice(0,2) === "--") el.style.setProperty(p, v[p]);
          else el.style[p] = v[p];
        }
      }
      else if(k.slice(0,2) === "on") el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? "true" : v);
    }
  }
  (children || []).forEach(function(c){
    if(c === null || c === undefined || c === false) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const now = () => Date.now();

function hostOf(raw){ try{ return new URL(raw).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function prettifyUrl(raw){
  try{
    const u = new URL(raw);
    const parts = u.pathname.split("/").filter(Boolean);
    const slug = parts.length ? parts[parts.length-1] : "";
    const words = decodeURIComponent(slug).replace(/\.(html?|php|aspx)$/i,"").replace(/[-_+]/g," ").trim();
    if(words && words.length > 2 && !/^\d+$/.test(words)){
      return words.charAt(0).toUpperCase() + words.slice(1);
    }
    return u.hostname.replace(/^www\./,"");
  }catch(e){ return raw; }
}
function dayDate(i){
  const s = state.trip.startDate;
  if(!s) return null;
  const p = s.split("-").map(Number);
  if(!p[0] || !p[1] || !p[2]) return null;
  return new Date(p[0], p[1]-1, p[2]+i);
}
function fmtDay(i, long){
  const d = dayDate(i);
  if(!d) return "";
  return d.toLocaleDateString(undefined, long
    ? {weekday:"short", day:"numeric", month:"short"}
    : {day:"numeric", month:"short"});
}
function kindOf(id){ return KINDS.find(k => k.id === id) || KINDS[0]; }
function slotLabel(id){ const s = SLOTS.find(x => x.id === id); return s ? s.label : ""; }
function ago(ts){
  if(!ts) return "never";
  const m = Math.round((now()-ts)/60000);
  if(m < 1) return "just now";
  if(m < 60) return m + "m ago";
  const hr = Math.round(m/60);
  if(hr < 24) return hr + "h ago";
  return Math.round(hr/24) + "d ago";
}

let toastTimer;
function toast(msg){
  const old = document.querySelector(".toast");
  if(old) old.remove();
  const t = h("div",{class:"toast",text:msg});
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.remove(); }, 3200);
}

/* ============================ data ops ============================ */
function live(){ return state.items.filter(i => !i.deleted); }
function ideas(){ return live().filter(i => i.day === null || i.day === undefined); }
function dayItems(d){
  return live().filter(i => i.day === d).sort(function(a,b){
    const sa = SLOTS.findIndex(s => s.id === a.slot);
    const sb = SLOTS.findIndex(s => s.id === b.slot);
    if(sa !== sb) return sa - sb;
    if(a.time && b.time) return a.time.localeCompare(b.time);
    if(a.time) return -1;
    if(b.time) return 1;
    return 0;
  });
}
function update(id, patch){
  const it = state.items.find(i => i.id === id);
  if(!it) return;
  Object.assign(it, patch, {updatedAt: now()});
  saveLocal(); render();
}
function removeItem(id){
  const it = state.items.find(i => i.id === id);
  if(!it) return;
  it.deleted = true; it.updatedAt = now();          /* tombstone, so deletes sync */
  ui.openId = null; ui.confirmId = null;
  saveLocal(); render();
}
function touchTrip(){ state.trip.updatedAt = now(); saveLocal(); }
function purgeOld(){
  const cutoff = now() - TOMBSTONE_DAYS*86400000;
  state.items = state.items.filter(i => !(i.deleted && (i.updatedAt||0) < cutoff));
}

/* merge two versions, newest wins per item */
function mergeStates(a, b){
  const byId = {};
  (a.items||[]).forEach(i => { if(i && i.id) byId[i.id] = i; });
  (b.items||[]).forEach(i => {
    if(!i || !i.id) return;
    const cur = byId[i.id];
    if(!cur || (i.updatedAt||0) > (cur.updatedAt||0)) byId[i.id] = i;
  });
  const at = (a.trip && a.trip.updatedAt) || 0;
  const bt = (b.trip && b.trip.updatedAt) || 0;
  const trip = bt > at ? b.trip : a.trip;
  return {
    trip: Object.assign({name:"", startDate:"", dayCount:12, updatedAt:0}, trip||{}),
    items: Object.keys(byId).map(k => byId[k])
  };
}

/* ============================ jsonbin sync ============================ */
let busy = false, pushTimer = null, pendingPush = false;

function headers(extra){
  return Object.assign({
    "Content-Type":"application/json",
    "X-Master-Key": sync.key
  }, extra || {});
}
function setStatus(s, msg){
  sync.status = s;
  sync.message = msg || "";
  saveSync();
  renderHeader();
}
function connected(){ return !!(sync.key && sync.bin); }

async function createBin(){
  if(!sync.key) throw new Error("Add your JSONBin key first.");
  const res = await fetch(API + "/b", {
    method:"POST",
    headers: headers({"X-Bin-Name":"Trip Planner","X-Bin-Private":"true"}),
    body: JSON.stringify(state)
  });
  if(!res.ok) throw new Error("JSONBin said " + res.status + ". Check the key.");
  const data = await res.json();
  const id = data && data.metadata && data.metadata.id;
  if(!id) throw new Error("No bin ID came back.");
  return id;
}

async function pull(){
  if(!connected() || busy) return;
  busy = true; setStatus("busy");
  try{
    const res = await fetch(API + "/b/" + sync.bin + "/latest?meta=false", { headers: headers() });
    if(res.status === 404) throw new Error("Bin not found — check the ID.");
    if(res.status === 401) throw new Error("Key rejected by JSONBin.");
    if(!res.ok) throw new Error("JSONBin said " + res.status + ".");
    const remote = await res.json();
    if(remote && (Array.isArray(remote.items) || remote.trip)){
      state = mergeStates(state, remote);
      purgeOld();
      try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
      render();
    }
    sync.lastSync = now();
    setStatus("ok");
  }catch(e){
    setStatus("err", e.message || "Sync failed");
  }finally{ busy = false; }
}

async function push(){
  if(!connected()) return;
  if(busy){ pendingPush = true; return; }
  busy = true; setStatus("busy");
  try{
    purgeOld();
    const res = await fetch(API + "/b/" + sync.bin, {
      method:"PUT", headers: headers(), body: JSON.stringify(state)
    });
    if(!res.ok) throw new Error("JSONBin said " + res.status + ".");
    sync.lastSync = now();
    setStatus("ok");
  }catch(e){
    setStatus("err", navigator.onLine ? (e.message || "Sync failed") : "Offline — saved on this phone");
  }finally{
    busy = false;
    if(pendingPush){ pendingPush = false; schedulePush(); }
  }
}

function schedulePush(){
  if(!connected()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 2000);
}
async function syncNow(){
  if(!connected()){ openSettings(); return; }
  await pull();
  await push();
}

/* ============================ sheet shell ============================ */
let closeSheet = null;
function openSheet(title, buildBody, buildFoot){
  const layer = document.getElementById("layer");
  layer.textContent = "";
  const body = h("div",{class:"sheet-body"});
  const foot = h("div",{class:"sheet-foot"});
  const sheet = h("div",{class:"sheet",role:"dialog","aria-modal":"true",
    onclick:function(e){ e.stopPropagation(); }},[
    h("div",{class:"sheet-head"},[
      h("h3",{text:title}),
      h("button",{class:"x","aria-label":"Close",onclick:close},["×"])
    ]), body, foot
  ]);
  layer.appendChild(h("div",{class:"backdrop",onclick:close},[sheet]));
  document.body.style.overflow = "hidden";

  function redraw(){
    body.textContent = "";
    buildBody(body, redraw, close);
    foot.textContent = "";
    if(buildFoot) buildFoot(foot, redraw, close);
  }
  function close(){
    layer.textContent = "";
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onKey);
    closeSheet = null;
  }
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  closeSheet = close;
  redraw();
  return {redraw:redraw, close:close};
}

/* ============================ pickers ============================ */
function dayGrid(value, onPick){
  const g = h("div",{class:"daygrid"});
  g.appendChild(h("button",{class:"pill","data-on": value === null || value === undefined,
    onclick:function(){ onPick(null); }},["Ideas"]));
  for(let d=0; d<state.trip.dayCount; d++){
    (function(d){
      const date = fmtDay(d,false);
      g.appendChild(h("button",{class:"pill","data-on":value===d,onclick:function(){ onPick(d); }},[
        h("span",{class:"pilldot",style:{background:LINES[d%LINES.length]}}),
        document.createTextNode("Day "+(d+1)),
        date ? h("small",{text:date}) : null
      ]));
    })(d);
  }
  return g;
}
function slotGrid(value, onPick){
  const g = h("div",{class:"slotgrid"});
  SLOTS.forEach(function(s){
    g.appendChild(h("button",{class:"pill","data-on":value===s.id,
      onclick:function(){ onPick(s.id); }},[s.label]));
  });
  return g;
}

/* ============================ composer ============================ */
function blankDraft(day){
  return {title:"", url:"", kind:"see", note:"", day: day === undefined ? null : day,
          slot:"flex", time:""};
}
function openComposer(draft, editId){
  const d = Object.assign({}, draft);
  let extras = !!(d.url || d.note);

  const sheet = openSheet(editId ? "Edit" : "Add to trip", function(body, redraw){
    const title = h("input",{class:"bigin",value:d.title,placeholder:"Name it, or paste a link",
      oninput:function(e){
        const v = e.target.value;
        if(/^https?:\/\/\S+$/i.test(v.trim())){
          d.url = v.trim(); d.title = prettifyUrl(v.trim()); extras = true; redraw();
        } else { d.title = v; refreshFoot(); }
      }});
    body.appendChild(h("div",{},[h("p",{class:"panel-label",text:"What is it"}), title]));

    const kinds = h("div",{class:"kindgrid"});
    KINDS.forEach(function(k){
      kinds.appendChild(h("button",{class:"pill","data-on":d.kind===k.id,
        onclick:function(){ d.kind = k.id; redraw(); }},[k.label]));
    });
    body.appendChild(h("div",{},[h("p",{class:"panel-label",text:"Type"}), kinds]));

    body.appendChild(h("div",{},[
      h("p",{class:"panel-label",text:"Which day"}),
      dayGrid(d.day, function(v){ d.day = v; redraw(); })
    ]));

    if(d.day !== null && d.day !== undefined){
      body.appendChild(h("div",{},[
        h("p",{class:"panel-label",text:"When"}),
        slotGrid(d.slot, function(v){ d.slot = v; redraw(); }),
        h("input",{class:"bigin",type:"time",value:d.time,style:{marginTop:"7px"},
          oninput:function(e){ d.time = e.target.value; }})
      ]));
    }

    if(extras){
      body.appendChild(h("div",{},[
        h("p",{class:"panel-label",text:"Link"}),
        h("input",{class:"bigin",value:d.url,placeholder:"https://",inputmode:"url",
          oninput:function(e){ d.url = e.target.value; refreshFoot(); }})
      ]));
      body.appendChild(h("div",{},[
        h("p",{class:"panel-label",text:"Note"}),
        h("textarea",{class:"bigin",placeholder:"Booking ref, who suggested it, how to get there…",
          oninput:function(e){ d.note = e.target.value; }},[d.note])
      ]));
    } else {
      body.appendChild(h("button",{class:"addhere",
        onclick:function(){ extras = true; redraw(); }},["+ Add a link or note"]));
    }
    if(!editId) setTimeout(function(){ title.focus(); }, 60);
  }, function(foot){ foot.appendChild(saveBtn()); });

  function target(){ return (d.day === null || d.day === undefined) ? "Ideas" : "Day "+(d.day+1); }
  function canSave(){ return !!(d.title.trim() || d.url.trim()); }
  function saveBtn(){
    return h("button",{class:"btn cta",disabled:!canSave(),onclick:commit},
      [editId ? "Save changes" : "Add to "+target()]);
  }
  function refreshFoot(){
    const foot = document.querySelector(".sheet-foot");
    if(foot){ foot.textContent = ""; foot.appendChild(saveBtn()); }
  }
  function commit(){
    const title = d.title.trim() || (d.url ? prettifyUrl(d.url) : "");
    if(!title) return;
    if(editId){
      update(editId, Object.assign({}, d, {title:title}));
    } else {
      state.items.push(Object.assign({}, d, {title:title, id:uid(), booked:false, updatedAt:now()}));
      if(d.day !== null && d.day !== undefined) ui.pane = "route";
      saveLocal();
    }
    sheet.close();
    render();
    toast(editId ? "Updated" : "Added to " + target());
  }
}

/* ============================ settings ============================ */
function openSettings(){
  let keyDraft = sync.key, binDraft = sync.bin;

  openSheet("Trip settings", function(body, redraw, close){
    /* trip */
    body.appendChild(h("div",{},[
      h("p",{class:"panel-label",text:"Trip name"}),
      h("input",{class:"bigin",value:state.trip.name,
        oninput:function(e){ state.trip.name = e.target.value; touchTrip(); renderHeader(); }})
    ]));
    body.appendChild(h("div",{},[
      h("p",{class:"panel-label",text:"First day"}),
      h("input",{class:"bigin mono",type:"date",value:state.trip.startDate,
        onchange:function(e){ state.trip.startDate = e.target.value; touchTrip(); render(); }})
    ]));
    body.appendChild(h("div",{},[
      h("p",{class:"panel-label",text:"How many days"}),
      h("div",{class:"stepper"},[
        h("button",{"aria-label":"Fewer days",onclick:function(){
          state.trip.dayCount = Math.max(1, state.trip.dayCount-1); touchTrip(); render(); redraw();
        }},["−"]),
        h("span",{text:state.trip.dayCount + (state.trip.dayCount===1?" day":" days")}),
        h("button",{"aria-label":"More days",onclick:function(){
          state.trip.dayCount = Math.min(60, state.trip.dayCount+1); touchTrip(); render(); redraw();
        }},["+"])
      ])
    ]));

    /* sync */
    body.appendChild(h("div",{},[
      h("p",{class:"panel-label",text:"Sync between phones (JSONBin)"}),
      h("input",{class:"bigin mono",value:keyDraft,placeholder:"X-Master-Key",
        autocomplete:"off",autocapitalize:"none",spellcheck:"false",
        oninput:function(e){ keyDraft = e.target.value.trim(); }}),
      h("input",{class:"bigin mono",value:binDraft,placeholder:"Bin ID",style:{marginTop:"7px"},
        autocomplete:"off",autocapitalize:"none",spellcheck:"false",
        oninput:function(e){ binDraft = e.target.value.trim(); }}),
      h("p",{class:"hint",text:
        "Enter your key on each phone — it's stored on the device, never in the app's code. "+
        "On the first phone, leave the Bin ID blank and tap Create bin. On the second, paste the "+
        "same key and the Bin ID it gives you."})
    ]));

    const row = h("div",{class:"actions"},[
      h("button",{onclick:async function(){
        sync.key = keyDraft; sync.bin = binDraft; saveSync();
        if(!sync.key){ toast("Add your key first."); return; }
        if(!sync.bin){
          setStatus("busy");
          try{
            sync.bin = await createBin();
            binDraft = sync.bin;
            saveSync(); setStatus("ok");
            sync.lastSync = now();
            redraw();
            toast("Bin created — copy the ID onto the other phone.");
          }catch(e){ setStatus("err", e.message); toast(e.message); }
          return;
        }
        close();
        await syncNow();
        toast(sync.status === "ok" ? "Synced" : (sync.message || "Sync failed"));
      }},[ sync.bin || binDraft ? "Save & sync" : "Create bin" ]),
      h("button",{"data-danger": connected() ? "true" : false, onclick:function(){
        if(!connected()){ toast("Not connected yet."); return; }
        if(!confirm("Stop syncing? The plan stays on this phone.")) return;
        sync.key = ""; sync.bin = ""; sync.lastSync = 0;
        setStatus("off"); saveSync(); redraw(); toast("Sync off");
      }},["Disconnect"])
    ]);
    body.appendChild(row);

    if(sync.bin){
      body.appendChild(h("p",{class:"hint",
        text:"Bin ID: " + sync.bin + "  ·  last sync " + ago(sync.lastSync) +
             (sync.message ? "  ·  " + sync.message : "")}));
    }

    /* backup */
    body.appendChild(h("div",{},[
      h("p",{class:"panel-label",text:"Backup file"}),
      h("div",{class:"actions"},[
        h("button",{onclick:exportFile},["Export"]),
        h("button",{onclick:importFile},["Import"])
      ])
    ]));
  }, function(foot, redraw, close){
    foot.appendChild(h("button",{class:"btn cta ghost",onclick:close},["Done"]));
  });
}

/* ============================ share / backup ============================ */
function buildText(){
  const t = state.trip;
  const out = [(t.name || "Our trip").toUpperCase()];
  if(t.startDate) out.push("Starting " + fmtDay(0,true));
  out.push("");
  for(let d=0; d<t.dayCount; d++){
    const date = fmtDay(d,true);
    out.push("DAY " + (d+1) + (date ? " — " + date : ""));
    const list = dayItems(d);
    if(!list.length) out.push("  (nothing planned)");
    list.forEach(function(i){
      const when = i.time || slotLabel(i.slot) || "";
      out.push("  " + when.padEnd(10) + " " + i.title + (i.booked ? "  [booked]" : ""));
      if(i.url) out.push("             " + i.url);
      if(i.note) out.push("             " + i.note);
    });
    out.push("");
  }
  const pool = ideas();
  if(pool.length){
    out.push("IDEAS — NOT YET PLACED");
    pool.forEach(function(i){ out.push("  " + i.title + (i.url ? " — " + i.url : "")); });
  }
  return out.join("\n");
}
function openShare(){
  const text = buildText();
  openSheet("Share plan", function(body){
    body.appendChild(h("div",{},[
      h("p",{class:"panel-label",text:"The plan as text"}),
      h("textarea",{class:"bigin share",readonly:true,
        onfocus:function(e){ e.target.select(); }},[text])
    ]));
    const row = h("div",{class:"actions"});
    if(navigator.share){
      row.appendChild(h("button",{onclick:function(){
        navigator.share({title: state.trip.name || "Our trip", text:text}).catch(function(){});
      }},["Share…"]));
    }
    row.appendChild(h("button",{onclick:function(){
      if(navigator.clipboard){
        navigator.clipboard.writeText(text).then(function(){ toast("Copied"); })
          .catch(function(){ toast("Select the text above to copy"); });
      } else toast("Select the text above to copy");
    }},["Copy"]));
    body.appendChild(row);
  }, function(foot, r, close){
    foot.appendChild(h("button",{class:"btn cta ghost",onclick:close},["Done"]));
  });
}
function exportFile(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = h("a",{href:url,download:"trip-plan-"+new Date().toISOString().slice(0,10)+".json"});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast("Exported");
}
function importFile(){
  const input = h("input",{type:"file",accept:"application/json,.json",style:{display:"none"}});
  input.addEventListener("change", function(){
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const p = JSON.parse(reader.result);
        if(!p || !Array.isArray(p.items)) throw new Error("bad");
        if(!confirm("Merge that file into this plan?")) return;
        state = mergeStates(state, p);
        saveLocal();
        if(closeSheet) closeSheet();
        render();
        toast("Imported");
      }catch(e){ toast("That file didn't look like a trip plan."); }
    };
    reader.readAsText(file);
  });
  document.body.appendChild(input); input.click(); input.remove();
}

/* ============================ item card ============================ */
function itemCard(item, color, inline){
  const open = ui.openId === item.id;
  const kind = kindOf(item.kind);
  const placed = item.day !== null && item.day !== undefined;
  const meta = [kind.label, item.time, placed ? slotLabel(item.slot) : null, hostOf(item.url)]
    .filter(Boolean).join("  ·  ") + (item.booked ? "  ·  booked" : "");

  const card = h("div",{class:"item",style:{"--line":color}});
  if(!inline){
    const node = h("span",{class:"node "+kind.shape});
    if(item.booked) node.setAttribute("data-booked","true");
    card.appendChild(node);
  }
  const inner = h("span",{style:{flex:"1",minWidth:"0"}},[
    h("span",{class:"item-title",text:item.title}),
    h("span",{class:"sub",text:meta})
  ]);
  if(item.note && !open) inner.appendChild(h("span",{class:"note",style:{display:"block"},text:item.note}));

  card.appendChild(h("button",{class:"item-main","aria-expanded":open,
    onclick:function(){ ui.openId = open ? null : item.id; ui.confirmId = null; render(); }},
    [inner, h("span",{class:"caret",text: open ? "▲" : "▼"})]));

  if(open){
    const panel = h("div",{class:"panel"});
    if(item.note) panel.appendChild(h("p",{class:"note",style:{marginTop:"0"},text:item.note}));
    if(item.url) panel.appendChild(h("a",{class:"openlink",href:item.url,target:"_blank",
      rel:"noreferrer"},["Open link ↗"]));
    panel.appendChild(h("div",{},[
      h("p",{class:"panel-label",text:"Move to"}),
      dayGrid(placed ? item.day : null, function(v){ update(item.id,{day:v}); })
    ]));
    if(placed){
      panel.appendChild(h("div",{},[
        h("p",{class:"panel-label",text:"When"}),
        slotGrid(item.slot, function(v){ update(item.id,{slot:v}); })
      ]));
    }
    panel.appendChild(h("div",{class:"actions"},[
      h("button",{"data-on":item.booked,
        onclick:function(){ update(item.id,{booked:!item.booked}); }},
        [item.booked ? "Booked" : "Book it"]),
      h("button",{onclick:function(){ openComposer(item, item.id); }},["Edit details"]),
      ui.confirmId === item.id
        ? h("button",{"data-danger":"true",onclick:function(){ removeItem(item.id); }},["Tap to remove"])
        : h("button",{onclick:function(){ ui.confirmId = item.id; render(); }},["Remove"])
    ]));
    card.appendChild(panel);
  }
  return card;
}

/* ============================ render ============================ */
const dayNodes = {};

function headerNode(){
  const t = state.trip;
  const last = t.dayCount - 1;
  const range = t.startDate ? fmtDay(0,true) + " – " + fmtDay(last,true) : "No dates set";
  const statusText = sync.status === "off" ? "Not syncing"
    : sync.status === "busy" ? "Syncing…"
    : sync.status === "err" ? (sync.message || "Sync problem")
    : "Synced " + ago(sync.lastSync);

  return h("header",{id:"top"},[
    h("p",{class:"eyebrow",text:"The route"}),
    h("div",{class:"topbar"},[
      h("div",{class:"topbar-main"},[
        h("input",{class:"name",value:t.name,placeholder:"Name this trip",
          oninput:function(e){ t.name = e.target.value; touchTrip(); }}),
        h("p",{class:"tripline"},[
          document.createTextNode(range + "  ·  " + t.dayCount + " days"),
          h("br"),
          h("span",{class:"syncdot","data-s":
            sync.status==="ok"?"ok":sync.status==="busy"?"busy":sync.status==="err"?"err":"off"}),
          document.createTextNode(statusText)
        ])
      ]),
      h("button",{class:"gear","aria-label":"Trip settings",onclick:openSettings},["⚙"])
    ])
  ]);
}
function renderHeader(){
  const old = document.getElementById("top");
  if(old) old.replaceWith(headerNode());
}

function render(){
  const app = document.getElementById("app");
  const se = document.scrollingElement || document.documentElement;
  const y = se.scrollTop;
  app.textContent = "";
  const t = state.trip;
  const wrap = h("div",{class:"wrap"});

  wrap.appendChild(headerNode());

  /* strip */
  const strip = h("div",{class:"strip"});
  strip.appendChild(h("button",{class:"stop","data-active":ui.activeDay===null,
    onclick:function(){ ui.activeDay = null; ui.pane = "ideas"; render(); }},[
      h("span",{class:"dot"}),
      h("span",{class:"stop-label"},["Ideas", h("span",{class:"stop-count",text:String(ideas().length)})])
  ]));
  for(let d=0; d<t.dayCount; d++){
    (function(d){
      strip.appendChild(h("button",{class:"stop","data-active":ui.activeDay===d,
        onclick:function(){ goToDay(d); }},[
          h("span",{class:"dot",style:{borderColor:LINES[d%LINES.length]}}),
          h("span",{class:"stop-label"},[
            "D" + (d+1),
            h("span",{class:"stop-count",text: fmtDay(d,false) || (dayItems(d).length+" stops")})
          ])
      ]));
    })(d);
  }
  wrap.appendChild(h("div",{class:"strip-outer",id:"strip"},[strip]));

  /* tabs */
  wrap.appendChild(h("div",{class:"tabs"},[
    h("button",{class:"tab","data-on":ui.pane==="ideas",
      onclick:function(){ ui.pane="ideas"; render(); }},["Ideas ("+ideas().length+")"]),
    h("button",{class:"tab","data-on":ui.pane==="route",
      onclick:function(){ ui.pane="route"; render(); }},["The days"])
  ]));

  /* desktop-only actions */
  wrap.appendChild(h("div",{class:"desk-actions"},[
    h("button",{class:"btn",onclick:function(){ openComposer(blankDraft(ui.activeDay)); }},
      ["+ Add to trip"]),
    h("button",{class:"btn ghost",onclick:openShare},["Share"]),
    h("button",{class:"btn ghost",onclick:syncNow},["Sync now"])
  ]));

  const cols = h("div",{class:"cols"});

  /* ideas */
  const pool = ideas();
  const ideaPane = h("section",{class:"pane","data-hidden":ui.pane!=="ideas"},[
    h("div",{class:"colhead"},[h("h2",{text:"Ideas"}),
      h("span",{class:"eyebrow",text:pool.length+" saved"})])
  ]);
  if(!pool.length){
    ideaPane.appendChild(h("div",{class:"empty"},[
      "Nothing waiting. Anything you add without a day lands here.",
      h("button",{class:"addhere",onclick:function(){ openComposer(blankDraft(null)); }},["+ Add an idea"])
    ]));
  } else {
    pool.forEach(function(i){ ideaPane.appendChild(itemCard(i,"#8A9490",true)); });
    ideaPane.appendChild(h("button",{class:"addhere",
      onclick:function(){ openComposer(blankDraft(null)); }},["+ Add an idea"]));
  }
  cols.appendChild(ideaPane);

  /* days */
  const routePane = h("section",{class:"pane","data-hidden":ui.pane!=="route"},[
    h("div",{class:"colhead"},[h("h2",{text:"Day by day"}),
      h("span",{class:"eyebrow",text:live().filter(i=>i.day!==null&&i.day!==undefined).length+" placed"})])
  ]);
  for(let d=0; d<t.dayCount; d++){
    (function(d){
      const color = LINES[d%LINES.length];
      const list = dayItems(d);
      const block = h("div",{class:"day",style:{"--line":color}},[
        h("div",{class:"dayhead"},[
          h("span",{class:"daynum",text:"DAY "+(d+1)}),
          h("span",{class:"daydate",text:fmtDay(d,true)})
        ])
      ]);
      if(!list.length){
        block.appendChild(h("div",{class:"empty"},[
          "Open.",
          h("button",{class:"addhere",onclick:function(){ openComposer(blankDraft(d)); }},
            ["+ Add to Day "+(d+1)])
        ]));
      } else {
        const track = h("div",{class:"track"});
        SLOTS.forEach(function(band){
          const inBand = list.filter(i => i.slot === band.id);
          if(!inBand.length) return;
          track.appendChild(h("p",{class:"band",text:band.label}));
          inBand.forEach(function(i){ track.appendChild(itemCard(i,color,false)); });
        });
        track.appendChild(h("button",{class:"addhere",
          onclick:function(){ openComposer(blankDraft(d)); }},["+ Add to Day "+(d+1)]));
        block.appendChild(track);
      }
      dayNodes[d] = block;
      routePane.appendChild(block);
    })(d);
  }
  cols.appendChild(routePane);
  wrap.appendChild(cols);
  app.appendChild(wrap);

  /* dock */
  app.appendChild(h("div",{class:"dock"},[
    h("button",{class:"btn",onclick:function(){ openComposer(blankDraft(ui.activeDay)); }},
      ["+ Add to trip"]),
    h("button",{class:"btn ghost",onclick:openShare},["Share"])
  ]));

  if(y) se.scrollTop = y;
}

function goToDay(d){
  ui.activeDay = d; ui.pane = "route"; render();
  requestAnimationFrame(function(){
    if(dayNodes[d]) dayNodes[d].scrollIntoView({behavior:"smooth",block:"start"});
  });
}

/* ============================ boot ============================ */
loadLocal();
purgeOld();
render();

if(connected()){
  pull();
  setInterval(function(){ if(!document.hidden) pull(); }, 120000);
}
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && connected()) pull();
});
window.addEventListener("online", function(){ if(connected()) syncNow(); });

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
