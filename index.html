<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Planner</title>
<meta name="description" content="Plan a trip day by day — ideas, restaurants and links on a route.">
<meta name="theme-color" content="#E7EBE4">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ============ theme: "Sun" (light) ============ */
:root{
  --ink:#241B31; --ink2:#786A85; --paper:#FFF0DA; --card:#FFFFFF; --rule:#EBD8BC;
  --sink:#FBE6C8;                       /* sunken / inset surfaces */
  --shadow:0 1px 0 rgba(36,27,49,.05), 0 2px 8px rgba(36,27,49,.04);
  --l1:#E4572E; --l2:#7B4BC4; --l3:#D93A75; --l4:#2E9E5B;
  --l5:#E29100; --l6:#2D7DD2; --l7:#12A0A0; --l8:#B85C24;
  --warn:#C0392B; --ok:#2E9E5B; --idle:#9A8CA6;
}
/* ============ theme: "Lava" (dark) ============ */
:root[data-theme="dark"]{
  --ink:#F6EDE1; --ink2:#A294B0; --paper:#171220; --card:#231B2F; --rule:#3A2F4A;
  --sink:#1E1729;
  --shadow:none;
  --l1:#FF7A52; --l2:#A886F5; --l3:#FF6FA1; --l4:#4FD07E;
  --l5:#FFC24D; --l6:#63A8F0; --l7:#3ED0CB; --l8:#E08A4E;
  --warn:#FF7A6B; --ok:#4FD07E; --idle:#6D5F7C;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); min-height:100vh;
  font-family:'Bricolage Grotesque','Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button{font-family:inherit;}
.wrap{padding:calc(14px + env(safe-area-inset-top)) 14px 108px;}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink2);margin:0;}

/* ---- header ---- */
.topbar{display:flex;align-items:flex-start;gap:8px;}
.topbar-main{flex:1;min-width:0;}
.name{width:100%;border:0;background:transparent;color:var(--ink);font-family:inherit;
  font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05;padding:2px 0;margin:4px 0 0;}
.name::placeholder{color:var(--idle);}
.tripline{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);margin:5px 0 0;
  line-height:1.7;}
.iconbtn{flex:0 0 auto;width:46px;height:46px;border-radius:14px;border:2px solid var(--rule);
  background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;margin-top:6px;
  box-shadow:var(--shadow);}
.iconbtn:active{transform:translateY(1px);}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;
  vertical-align:middle;background:var(--idle);}
.syncdot[data-s="ok"]{background:var(--ok);}
.syncdot[data-s="busy"]{background:var(--l5);}
.syncdot[data-s="err"]{background:var(--warn);}

/* ---- buttons ---- */
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;letter-spacing:.05em;
  text-transform:uppercase;padding:0 14px;min-height:50px;border-radius:14px;white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn[disabled]{opacity:.35;}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--rule);}
.cta{width:100%;min-height:54px;font-size:13px;}

/* ---- day strip ---- */
.strip-outer{margin:16px -14px 0;padding:0 14px 4px;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;touch-action:pan-x pan-y;}
.strip-outer::-webkit-scrollbar{display:none;}
.strip{position:relative;display:flex;width:max-content;padding:14px 0 6px;}
.strip::before{content:'';position:absolute;left:16px;right:16px;top:21px;height:3px;
  background:var(--rule);border-radius:2px;}
.stop{position:relative;background:transparent;border:0;cursor:pointer;padding:0 8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:8px;min-width:64px;scroll-snap-align:center;}
.dot{width:15px;height:15px;border-radius:50%;background:var(--rule);
  box-shadow:0 0 0 5px var(--paper);}
.stop[data-active="true"] .dot{transform:scale(1.4);}
.stop-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);white-space:nowrap;
  text-align:center;line-height:1.45;}
.stop[data-active="true"] .stop-label{color:var(--ink);font-weight:600;}
.stop-count{display:block;font-size:9px;opacity:.8;}

/* ---- tabs ---- */
.tabs{display:flex;gap:8px;margin-top:16px;}
.tab{flex:1;min-height:48px;border-radius:14px;border:2px solid var(--rule);background:var(--card);
  color:var(--ink2);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;padding:0 6px;}
.tab[data-on="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ---- panes ---- */
.cols{margin-top:18px;}
.pane[data-hidden="true"]{display:none;}
.colhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-bottom:8px;border-bottom:3px solid var(--ink);margin-bottom:14px;}
.colhead h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;}

/* ---- days ---- */
.day{margin-bottom:26px;scroll-margin-top:10px;}
.dayhead{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap;}
.daynum{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.08em;
  color:#fff;background:var(--line);padding:6px 11px;border-radius:99px;}
.daydate{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);}
.track{position:relative;padding-left:26px;}
.track::before{content:'';position:absolute;left:4px;top:6px;bottom:26px;width:3px;border-radius:2px;
  background:var(--line);opacity:.4;}
.band{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink2);margin:13px 0 6px;}
.band:first-child{margin-top:0;}
.addhere{width:100%;min-height:48px;margin-top:8px;border:2px dashed var(--rule);background:transparent;
  border-radius:14px;color:var(--ink2);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;
  padding:0 8px;}
.addhere:active{background:var(--sink);color:var(--ink);}

/* ---- items ---- */
.item{position:relative;background:var(--card);border:2px solid var(--rule);border-radius:16px;
  margin-bottom:10px;box-shadow:var(--shadow);}
.item[data-booked="true"]{border-color:var(--line);}
.item-main{display:flex;align-items:flex-start;gap:8px;width:100%;background:none;border:0;
  text-align:left;padding:13px 12px;cursor:pointer;color:inherit;}
.node{position:absolute;left:-26px;top:16px;width:15px;height:15px;background:var(--paper);
  border:3px solid var(--line);box-shadow:0 0 0 4px var(--paper);}
.node.circle{border-radius:50%;}
.node.square{border-radius:3px;}
.node.diamond{border-radius:3px;transform:rotate(45deg);}
.node.bar{height:8px;top:19px;border-radius:5px;}
.node[data-booked="true"]{background:var(--line);}
.item-title{font-size:16px;font-weight:600;line-height:1.35;word-break:break-word;
  overflow-wrap:anywhere;display:block;letter-spacing:-.01em;}
.sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);margin-top:4px;
  display:block;overflow-wrap:anywhere;}
.note{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.45;overflow-wrap:anywhere;}
.caret{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink2);padding-top:5px;}
.panel{border-top:2px solid var(--rule);padding:12px;display:flex;flex-direction:column;gap:12px;}
.panel-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink2);margin:0 0 7px;}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.actions button{min-height:48px;border-radius:14px;border:2px solid var(--rule);background:var(--card);
  color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;padding:0 6px;}
.actions button:active{transform:translateY(1px);}
.actions button[data-on="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.actions button[data-danger="true"]{color:var(--warn);border-color:var(--warn);}
.openlink{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink);
  text-decoration:underline;text-underline-offset:3px;padding:6px 0;overflow-wrap:anywhere;}

/* ---- pickers ---- */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
.kindgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.pill{min-height:50px;padding:5px 6px;border-radius:14px;border:2px solid var(--rule);
  background:var(--card);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.3;text-align:center;}
.pill:active{transform:translateY(1px);}
.pill[data-on="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.pill small{font-size:9px;opacity:.8;display:block;}
.pilldot{width:9px;height:9px;border-radius:50%;margin-bottom:3px;}

.empty{border:2px dashed var(--rule);border-radius:16px;padding:14px;font-size:13px;color:var(--ink2);
  line-height:1.5;}

/* ---- money ---- */
.costchip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:10px;
  background:var(--sink);border:2px solid var(--rule);border-radius:14px;padding:9px 13px;
  cursor:pointer;text-align:left;width:100%;color:inherit;}
.costchip:active{transform:translateY(1px);}
.costbig{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--ink);}
.costsub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink2);line-height:1.5;}
.daycost{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink);
  background:var(--sink);border-radius:99px;padding:4px 9px;margin-left:auto;}
.costlist{display:flex;flex-direction:column;gap:2px;}
.costrow{display:flex;align-items:center;gap:9px;padding:9px 0;
  border-bottom:1px solid var(--rule);}
.costrow:last-child{border-bottom:0;}
.costswatch{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
.costlabel{flex:1;min-width:0;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2);}
.costval{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--ink);}
.costval.strong{font-size:19px;letter-spacing:-.02em;}
.costtotal{border:2px solid var(--ink);border-radius:16px;padding:4px 13px;background:var(--card);}

/* ---- dock ---- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 64%,transparent);}
.dock .btn{flex:1;}
.dock .btn.ghost{flex:0 0 auto;width:82px;padding:0;}

/* ---- sheet ---- */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(20,14,28,.55);display:flex;
  align-items:flex-end;justify-content:center;}
.sheet{background:var(--paper);width:100%;max-width:620px;border-radius:26px 26px 0 0;max-height:92vh;
  display:flex;flex-direction:column;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 14px;
  border-bottom:2px solid var(--rule);}
.sheet-head h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;}
.x{border:0;background:transparent;color:var(--ink2);font-size:26px;line-height:1;width:46px;height:46px;
  cursor:pointer;}
.sheet-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:18px;
  -webkit-overflow-scrolling:touch;}
.sheet-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--rule);
  background:var(--card);}
.bigin{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:2px solid var(--rule);border-radius:14px;padding:13px 12px;}
.bigin::placeholder{color:var(--idle);}
textarea.bigin{resize:vertical;min-height:66px;line-height:1.5;}
textarea.share{min-height:220px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;}
input.mono{font-family:'IBM Plex Mono',monospace;font-size:14px;}
.hint{font-size:12px;color:var(--ink2);line-height:1.55;margin:7px 0 0;}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border:2px solid var(--rule);border-radius:14px;overflow:hidden;}
.stepper button{width:58px;min-height:50px;border:0;background:transparent;color:var(--ink);
  font-size:21px;cursor:pointer;}
.stepper button:active{background:var(--sink);}
.stepper span{font-family:'IBM Plex Mono',monospace;font-size:15px;}

/* ---- toast ---- */
.toast{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12px;
  padding:13px 15px;border-radius:14px;z-index:80;text-align:center;line-height:1.4;}

:focus-visible{outline:3px solid var(--l2);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ============ larger screens ============ */
@media (min-width:840px){
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 40px;}
  .name{font-size:50px;}
  .tabs{display:none;}
  .dock{display:none;}
  .cols{display:grid;grid-template-columns:310px 1fr;gap:26px;align-items:start;margin-top:24px;}
  .pane[data-hidden="true"]{display:block;}
  .stop{min-width:84px;padding:0 12px 6px;}
  .backdrop{align-items:center;padding:20px;}
  .sheet{border-radius:20px;max-height:84vh;}
  .toast{left:auto;right:24px;bottom:24px;max-width:420px;}
  .desk-actions{display:flex;gap:8px;margin-top:14px;}
}
@media (max-width:839px){ .desk-actions{display:none;} }
</style>
<script>
(function(){
  try{
    var p = localStorage.getItem("tripplan.theme") || "auto";
    var dark = p === "dark" || (p === "auto" &&
      window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", dark ? "#171220" : "#FFF0DA");
  }catch(e){}
})();
</script>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script>
"use strict";

/* ============================ constants ============================ */
const KEY = "tripplan.v1";
const SYNC_KEY = "tripplan.sync";
const API = "https://api.jsonbin.io/v3";
const LINES = ["var(--l1)","var(--l2)","var(--l3)","var(--l4)",
               "var(--l5)","var(--l6)","var(--l7)","var(--l8)"];
const KINDS = [
  {id:"see",  label:"See",  shape:"circle"},
  {id:"eat",  label:"Eat",  shape:"square"},
  {id:"stay", label:"Stay", shape:"diamond"},
  {id:"move", label:"Move", shape:"bar"}
];
const SLOTS = [
  {id:"morning",   label:"Morning"},
  {id:"afternoon", label:"Afternoon"},
  {id:"evening",   label:"Evening"},
  {id:"flex",      label:"Flexible"}
];
const TOMBSTONE_DAYS = 60;

/* ============================ state ============================ */
let state = {
  trip:{ name:"Lanzarote", startDate:"2026-08-15", dayCount:12, party:2, currency:"€", updatedAt:0 },
  items:[]
};
let sync = { key:"", bin:"", status:"off", lastSync:0, message:"" };
let ui = { pane:"route", activeDay:null, openId:null, confirmId:null };

function loadLocal(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p.trip) Object.assign(state.trip, p.trip);
      if(Array.isArray(p.items)) state.items = p.items;
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    if(raw) Object.assign(sync, JSON.parse(raw));
  }catch(e){}
  sync.status = sync.bin && sync.key ? "idle" : "off";
}
let saveTimer;
function saveLocal(push){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast("Couldn't save on this device — storage may be full."); }
    if(push !== false) schedulePush();
  }, 200);
}
function saveSync(){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch(e){}
}

/* ============================ helpers ============================ */
function h(tag, props, children){
  const el = document.createElement(tag);
  if(props){
    for(const k in props){
      const v = props[k];
      if(v === null || v === undefined || v === false) continue;
      if(k === "class") el.className = v;
      else if(k === "text") el.textContent = v;
      else if(k === "style" && typeof v === "object"){
        for(const p in v){
          if(p.slice(0,2) === "--") el.style.setProperty(p, v[p]);
          else el.style[p] = v[p];
        }
      }
      else if(k.slice(0,2) === "on") el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? "true" : v);
    }
  }
  (children || []).forEach(function(c){
    if(c === null || c === undefined || c === false) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const now = () => Date.now();

function hostOf(raw){ try{ return new URL(raw).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function prettifyUrl(raw){
  try{
    const u = new URL(raw);
    const parts = u.pathname.split("/").filter(Boolean);
    const slug = parts.length ? parts[parts.length-1] : "";
    const words = decodeURIComponent(slug).replace(/\.(html?|php|aspx)$/i,"").replace(/[-_+]/g," ").trim();
    if(words && words.length > 2 && !/^\d+$/.test(words)){
      return words.charAt(0).toUpperCase() + words.slice(1);
    }
    return u.hostname.replace(/^www\./,"");
  }catch(e){ return raw; }
}
function dayDate(i){
  const s = state.trip.startDate;
  if(!s) return null;
  const p = s.split("-").map(Number);
  if(!p[0] || !p[1] || !p[2]) return null;
  return new Date(p[0], p[1]-1, p[2]+i);
}
function fmtDay(i, long){
  const d = dayDate(i);
  if(!d) return "";
  return d.toLocaleDateString(undefined, long
    ? {weekday:"short", day:"numeric", month:"short"}
    : {day:"numeric", month:"short"});
}
function party(){ return Math.max(1, Math.min(20, Number(state.trip.party) || 1)); }
function currency(){ return state.trip.currency || "\u20ac"; }
function costOf(i){ const n = Number(i && i.cost); return isFinite(n) && n > 0 ? n : 0; }
function money(v){
  const n = Number(v) || 0;
  const raw = Math.abs(n % 1) > 0.005 ? n.toFixed(2) : String(Math.round(n));
  const parts = raw.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return currency() + parts.join(".");
}
function placed(i){ return i.day !== null && i.day !== undefined; }
function dayCostPP(d){ return dayItems(d).reduce(function(s,i){ return s + costOf(i); }, 0); }
function plannedCostPP(){ return live().filter(placed).reduce(function(s,i){ return s + costOf(i); }, 0); }
function ideasCostPP(){ return ideas().reduce(function(s,i){ return s + costOf(i); }, 0); }

function kindOf(id){ return KINDS.find(k => k.id === id) || KINDS[0]; }
function slotLabel(id){ const s = SLOTS.find(x => x.id === id); return s ? s.label : ""; }
function ago(ts){
  if(!ts) return "never";
  const m = Math.round((now()-ts)/60000);
  if(m < 1) return "just now";
  if(m < 60) return m + "m ago";
  const hr = Math.round(m/60);
  if(hr < 24) return hr + "h ago";
  return Math.round(hr/24) + "d ago";
}

/* ============================ theme ============================ */
const THEME_KEY = "tripplan.theme";
const THEMES = [
  {id:"auto",  label:"Auto",  glyph:"◐"},
  {id:"light", label:"Sun",   glyph:"☀"},
  {id:"dark",  label:"Lava",  glyph:"☾"}
];
function themePref(){
  try{ return localStorage.getItem(THEME_KEY) || "auto"; }catch(e){ return "auto"; }
}
function applyTheme(){
  const p = themePref();
  const dark = p === "dark" || (p === "auto" && window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", dark ? "#171220" : "#FFF0DA");
}
function setTheme(id){
  try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
  applyTheme();
  renderHeader();
}
function cycleTheme(){
  const ids = THEMES.map(t => t.id);
  const next = ids[(ids.indexOf(themePref()) + 1) % ids.length];
  setTheme(next);
  const t = THEMES.find(x => x.id === next);
  toast("Theme: " + t.label + (next === "auto" ? " (follows your phone)" : ""));
}
if(window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onChange = function(){ if(themePref() === "auto") applyTheme(); };
  if(mq.addEventListener) mq.addEventListener("change", onChange);
  else if(mq.addListener) mq.addListener(onChange);
}

let toastTimer;
function toast(msg){
  const old = document.querySelector(".toast");
  if(old) old.remove();
  const t = h("div",{class:"toast",text:msg});
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.remove(); }, 3200);
}

/* ============================ data ops ============================ */
function live(){ return state.items.filter(i => !i.deleted); }
function ideas(){ return live().filter(i => i.day === null || i.day === undefined); }
function dayItems(d){
  return live().filter(i => i.day === d).sort(function(a,b){
    const sa = SLOTS.findIndex(s => s.id === a.slot);
    const sb = SLOTS.findIndex(s => s.id === b.slot);
    if(sa !== sb) return sa - sb;
    if(a.time && b.time) return a.time.localeCompare(b.time);
    if(a.time) return -1;
    if(b.time) return 1;
    return 0;
  });
}
function update(id, patch){
  const it = state.items.find(i => i.id === id);
  if(!it) return;
  Object.assign(it, patch, {updatedAt: now()});
  saveLocal(); render();
}
function removeItem(id){
  const it = state.items.find(i => i.id === id);
  if(!it) return;
  it.deleted = true; it.updatedAt = now();          /* tombstone, so deletes sync */
  ui.openId = null; ui.confirmId = null;
  saveLocal(); render();
}
function touchTrip(){ state.trip.updatedAt = now(); saveLocal(); }
function purgeOld(){
  const cutoff = now() - TOMBSTONE_DAYS*86400000;
  state.items = state.items.filter(i => !(i.deleted && (i.updatedAt||0) < cutoff));
}

/* merge two versions, newest wins per item */
function mergeStates(a, b){
  const byId = {};
  (a.items||[]).forEach(i => { if(i && i.id) byId[i.id] = i; });
  (b.items||[]).forEach(i => {
    if(!i || !i.id) return;
    const cur = byId[i.id];
    if(!cur || (i.updatedAt||0) > (cur.updatedAt||0)) byId[i.id] = i;
  });
  const at = (a.trip && a.trip.updatedAt) || 0;
  const bt = (b.trip && b.trip.updatedAt) || 0;
  const trip = bt > at ? b.trip : a.trip;
  return {
    trip: Object.assign({name:"", startDate:"", dayCount:12, party:2, currency:"€", updatedAt:0}, trip||{}),
    items: Object.keys(byId).map(k => byId[k])
  };
}

/* ============================ jsonbin sync ============================ */
let busy = false, pushTimer = null, pendingPush = false;

function headers(extra){
  return Object.assign({
    "Content-Type":"application/json",
    "X-Master-Key": sync.key
  }, extra || {});
}
function setStatus(s, msg){
  sync.status = s;
  sync.message = msg || "";
  saveSync();
  renderHeader();
}
function connected(){ return !!(sync.key && sync.bin); }

async function createBin(){
  if(!sync.key) throw new Error("Add your JSONBin key first.");
  const res = await fetch(API + "/b", {
    method:"POST",
    headers: headers({"X-Bin-Name":"Trip Planner","X-Bin-Private":"true"}),
    body: JSON.stringify(state)
  });
  if(!res.ok) throw new Error("JSONBin said " + res.status + ". Check the key.");
  const data = await res.json();
  const id = data && data.metadata && data.metadata.id;
  if(!id) throw new Error("No bin ID came back.");
  return id;
}

async function pull(){
  if(!connected() || busy) return;
  busy = true; setStatus("busy");
  try{
    const res = await fetch(API + "/b/" + sync.bin + "/latest?meta=false", { headers: headers() });
    if(res.status === 404) throw new Error("Bin not found — check the ID.");
    if(res.status === 401) throw new Error("Key rejected by JSONBin.");
    if(!res.ok) throw new Error("JSONBin said " + res.status + ".");
    const remote = await res.json();
    if(remote && (Array.isArray(remote.items) || remote.trip)){
      state = mergeStates(state, remote);
      purgeOld();
      try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
      render();
    }
    sync.lastSync = now();
    setStatus("ok");
  }catch(e){
    setStatus("err", e.message || "Sync failed");
  }finally{ busy = false; }
}

async function push(){
  if(!connected()) return;
  if(busy){ pendingPush = true; return; }
  busy = true; setStatus("busy");
  try{
    purgeOld();
    const res = await fetch(API + "/b/" + sync.bin, {
      method:"PUT", headers: headers(), body: JSON.stringify(state)
    });
    if(!res.ok) throw new Error("JSONBin said " + res.status + ".");
    sync.lastSync = now();
    setStatus("ok");
  }catch(e){
    setStatus("err", navigator.onLine ? (e.message || "Sync failed") : "Offline — saved on this phone");
  }finally{
    busy = false;
    if(pendingPush){ pendingPush = false; schedulePush(); }
  }
}

function schedulePush(){
  if(!connected()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 2000);
}
async function syncNow(){
  if(!connected()){ openSettings(); return; }
  await pull();
  await push();
}

/* ============================ sheet shell ============================ */
let closeSheet = null;
function openSheet(title, buildBody, buildFoot){
  const layer = document.getElementById("layer");
  layer.textContent = "";
  const body = h("div",{class:"sheet-body"});
  const foot = h("div",{class:"sheet-foot"});
  const sheet = h("div",{class:"sheet",role:"dialog","aria-modal":"true",
    onclick:function(e){ e.stopPropagation(); }},[
    h("div",{class:"sheet-head"},[
      h("h3",{text:title}),
      h("button",{class:"x","aria-label":"Close",onclick:close},["×"])
    ]), body, foot
  ]);
  layer.appendChild(h("div",{class:"backdrop",onclick:close},[sheet]));
  document.body.style.overflow = "hidden";

  function redraw(){
    body.textContent = "";
    buildBody(body, redraw, close);
    foot.textContent = "";
    if(buildFoot) buildFoot(foot, redraw, close);
  }
  function close(){
    layer.textContent = "";
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onKey);
    closeSheet = null;
  }
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  closeSheet = close;
  redraw();
  return {redraw:redraw, close:close};
}

/* ============================ share / backup ============================ */
function buildText(){
  const t = state.trip;
  const out = [(t.name || "Our trip").toUpperCase()];
  if(t.startDate) out.push("Starting " + fmtDay(0,true));
  out.push("");
  for(let d=0; d<t.dayCount; d++){
    const date = fmtDay(d,true);
    out.push("DAY " + (d+1) + (date ? " — " + date : ""));
    const list = dayItems(d);
    if(!list.length) out.push("  (nothing planned)");
    list.forEach(function(i){
      const when = i.time || slotLabel(i.slot) || "";
      const c = costOf(i);
      out.push("  " + when.padEnd(10) + " " + i.title +
        (c ? "  " + money(c) + " pp" : "") + (i.booked ? "  [booked]" : ""));
      if(i.url) out.push("             " + i.url);
      if(i.note) out.push("             " + i.note);
    });
    out.push("");
  }
  const pool = ideas();
  if(pool.length){
    out.push("IDEAS — NOT YET PLACED");
    pool.forEach(function(i){
      const c = costOf(i);
      out.push("  " + i.title + (c ? "  " + money(c) + " pp" : "") + (i.url ? " — " + i.url : ""));
    });
    out.push("");
  }
  const totalPP = plannedCostPP();
  if(totalPP > 0){
    out.push("TOTAL PLANNED");
    out.push("  " + money(totalPP) + " each  ·  " + money(totalPP * party()) +
             " for " + party() + (party() === 1 ? " person" : " people"));
  }
  return out.join("\n");
}
function openShare(){

  openSheet("Share plan", function(body){

function exportFile(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = h("a",{href:url,download:"trip-plan-"+new Date().toISOString().slice(0,10)+".json"});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

function importFile(){
  const input = h("input",{type:"file",accept:"application/json,.json",style:{display:"none"}});
  input.addEventListener("change", function(){
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const p = JSON.parse(reader.result);
        if(!p || !Array.isArray(p.items)) throw new Error("bad");
        if(!confirm("Merge that file into this plan?")) return;
        state = mergeStates(state, p);
        saveLocal();
        if(closeSheet) closeSheet();
        render();
        toast("Imported");
      }catch(e){ toast("That file didn't look like a trip plan."); }
    };
    reader.readAsText(file);
  });
  document.body.appendChild(input); input.click(); input.remove();
}

  const inner = h("span",{style:{flex:"1",minWidth:"0"}},[
    h("span",{class:"item-title",text:item.title}),

  if(open){
    const panel = h("div",{class:"panel"});
    if(item.note) panel.appendChild(h("p",{class:"note",style:{marginTop:"0"},text:item.note}));
    if(item.url) panel.appendChild(h("a",{class:"openlink",href:item.url,target:"_blank",
      rel:"noreferrer"},["Open link ↗"]));
    if(c) panel.appendChild(h("p",{class:"hint",style:{margin:"0"},
      text: money(c) + " each  ·  " + money(c * party()) + " for " + party() +
            (party() === 1 ? " person" : " people")}));
    panel.appendChild(h("div",{},[
      h("p",{class:"panel-label",text:"Move to"}),
      dayGrid(isPlaced ? item.day : null, function(v){ update(item.id,{day:v}); })
    ]));
    if(isPlaced){
      panel.appendChild(h("div",{},[
        h("p",{class:"panel-label",text:"When"}),
        slotGrid(item.slot, function(v){ update(item.id,{slot:v}); })
      ]));
    }
    panel.appendChild(h("div",{class:"actions"},[
      h("button",{"data-on":item.booked,
        onclick:function(){ update(item.id,{booked:!item.booked}); }},
        [item.booked ? "Booked" : "Book it"]),
      h("button",{onclick:function(){ openComposer(item, item.id); }},["Edit details"]),
      ui.confirmId === item.id
        ? h("button",{"data-danger":"true",onclick:function(){ removeItem(item.id); }},["Tap to remove"])
        : h("button",{onclick:function(){ ui.confirmId = item.id; render(); }},["Remove"])
    ]));
    card.appendChild(panel);
  }
  return card;
}

/* ============================ render ============================ */
const dayNodes = {};

function headerNode(){
  const t = state.trip;
  const last = t.dayCount - 1;
  const range = t.startDate ? fmtDay(0,true) + " – " + fmtDay(last,true) : "No dates set";
  const statusText = sync.status === "off" ? "Not syncing"
    : sync.status === "busy" ? "Syncing…"
    : sync.status === "err" ? (sync.message || "Sync problem")
    : "Synced " + ago(sync.lastSync);

  return h("header",{id:"top"},[
    h("p",{class:"eyebrow",text:"The route"}),
    h("div",{class:"topbar"},[
      h("div",{class:"topbar-main"},[
        h("input",{class:"name",value:t.name,placeholder:"Name this trip",
          oninput:function(e){ t.name = e.target.value; touchTrip(); }}),
        h("p",{class:"tripline"},[
          document.createTextNode(range + "  ·  " + t.dayCount + " days"),
          h("br"),
          h("span",{class:"syncdot","data-s":
            sync.status==="ok"?"ok":sync.status==="busy"?"busy":sync.status==="err"?"err":"off"}),
          document.createTextNode(statusText)
        ]),
        costChip()
      ]),
      h("button",{class:"iconbtn","aria-label":"Change theme",title:"Theme",
        onclick:cycleTheme},[(THEMES.find(x=>x.id===themePref())||THEMES[0]).glyph]),
      h("button",{class:"iconbtn","aria-label":"Trip settings",onclick:openSettings},["⚙"])
    ])
  ]);
}
function costChip(){
  const pp = plannedCostPP();
  const p = party();
  const pool = ideasCostPP();
  return h("button",{class:"costchip",onclick:openCosts},[
    h("span",{class:"costbig",text: money(pp * p)}),
    h("span",{class:"costsub",
      text:"planned for " + p + (p === 1 ? " person" : " people") +
           "  ·  " + money(pp) + " each" +
           (pool > 0 ? "  ·  " + money(pool * p) + " more in ideas" : "")})
  ]);
}

function openCosts(){
  openSheet("What it adds up to", function(body){
    const p = party();
    const rows = [];
    for(let d=0; d<state.trip.dayCount; d++){
      const sub = dayCostPP(d);
      if(sub > 0) rows.push({label:"Day " + (d+1) + (fmtDay(d,false) ? "  " + fmtDay(d,false) : ""),
                             value: sub, color: LINES[d % LINES.length]});
    }
    if(!rows.length && ideasCostPP() === 0){
      body.appendChild(h("div",{class:"empty"},[
        "No costs yet. Add a cost per person to any item and it'll total up here."
      ]));
      return;
    }
    const list = h("div",{class:"costlist"});
    rows.forEach(function(r){
      list.appendChild(h("div",{class:"costrow"},[
        h("span",{class:"costswatch",style:{background:r.color}}),
        h("span",{class:"costlabel",text:r.label}),
        h("span",{class:"costval",text:money(r.value * p)})
      ]));
    });
    if(!rows.length) list.appendChild(h("p",{class:"hint",text:"Nothing costed on a day yet."}));
    body.appendChild(h("div",{},[h("p",{class:"panel-label",text:"By day"}), list]));

    const total = plannedCostPP();
    body.appendChild(h("div",{class:"costtotal"},[
      h("div",{class:"costrow"},[
        h("span",{class:"costlabel",text:"Planned, all " + p + (p===1?" person":" people")}),
        h("span",{class:"costval strong",text:money(total * p)})
      ]),
      h("div",{class:"costrow"},[
        h("span",{class:"costlabel",text:"Per person"}),
        h("span",{class:"costval",text:money(total)})
      ])
    ]));

    const pool = ideasCostPP();
    if(pool > 0){
      body.appendChild(h("div",{},[
        h("p",{class:"panel-label",text:"Still just ideas"}),
        h("div",{class:"costrow"},[
          h("span",{class:"costlabel",text:"If you booked everything in Ideas"}),
          h("span",{class:"costval",text:"+ " + money(pool * p)})
        ]),
        h("p",{class:"hint",text:"Ideas aren't counted in the total until you give them a day."})
      ]));
    }
    body.appendChild(h("p",{class:"hint",
      text:"Costs are what you type in per person. Change the number of people in ⚙ settings."}));
  }, function(foot, r, close){
    foot.appendChild(h("button",{class:"btn cta ghost",onclick:close},["Done"]));
  });
}

function renderHeader(){
  const old = document.getElementById("top");
  if(old) old.replaceWith(headerNode());
}

function render(){
  const app = document.getElementById("app");
  const se = document.scrollingElement || document.documentElement;
  const y = se.scrollTop;
  app.textContent = "";
  const t = state.trip;
  const wrap = h("div",{class:"wrap"});

  wrap.appendChild(headerNode());

  /* strip */
  const strip = h("div",{class:"strip"});
  strip.appendChild(h("button",{class:"stop","data-active":ui.activeDay===null,
    onclick:function(){ ui.activeDay = null; ui.pane = "ideas"; render(); }},[
      h("span",{class:"dot",style:{background:"var(--idle)"}}),
      h("span",{class:"stop-label"},["Ideas", h("span",{class:"stop-count",text:String(ideas().length)})])
  ]));
  for(let d=0; d<t.dayCount; d++){
    (function(d){
      strip.appendChild(h("button",{class:"stop","data-active":ui.activeDay===d,
        onclick:function(){ goToDay(d); }},[
          h("span",{class:"dot",style:{background:LINES[d%LINES.length]}}),
          h("span",{class:"stop-label"},[
            "D" + (d+1),
            h("span",{class:"stop-count",text: fmtDay(d,false) || (dayItems(d).length+" stops")})
          ])
      ]));
    })(d);
  }
  wrap.appendChild(h("div",{class:"strip-outer",id:"strip"},[strip]));

  /* tabs */
  wrap.appendChild(h("div",{class:"tabs"},[
    h("button",{class:"tab","data-on":ui.pane==="ideas",
      onclick:function(){ ui.pane="ideas"; render(); }},["Ideas ("+ideas().length+")"]),
    h("button",{class:"tab","data-on":ui.pane==="route",
      onclick:function(){ ui.pane="route"; render(); }},["The days"])
  ]));

  /* desktop-only actions */
  wrap.appendChild(h("div",{class:"desk-actions"},[
    h("button",{class:"btn",onclick:function(){ openComposer(blankDraft(ui.activeDay)); }},
      ["+ Add to trip"]),
    h("button",{class:"btn ghost",onclick:openShare},["Share"]),
    h("button",{class:"btn ghost",onclick:syncNow},["Sync now"])
  ]));

  const cols = h("div",{class:"cols"});

  /* ideas */
  const pool = ideas();
  const ideaPane = h("section",{class:"pane","data-hidden":ui.pane!=="ideas"},[
    h("div",{class:"colhead"},[h("h2",{text:"Ideas"}),
      h("span",{class:"eyebrow",text:pool.length+" saved"})])
  ]);
  if(!pool.length){
    ideaPane.appendChild(h("div",{class:"empty"},[
      "Nothing waiting. Anything you add without a day lands here.",
      h("button",{class:"addhere",onclick:function(){ openComposer(blankDraft(null)); }},["+ Add an idea"])
    ]));
  } else {
    pool.forEach(function(i){ ideaPane.appendChild(itemCard(i,"var(--idle)",true)); });
    ideaPane.appendChild(h("button",{class:"addhere",
      onclick:function(){ openComposer(blankDraft(null)); }},["+ Add an idea"]));
  }
  cols.appendChild(ideaPane);

  /* days */
  const routePane = h("section",{class:"pane","data-hidden":ui.pane!=="route"},[
    h("div",{class:"colhead"},[h("h2",{text:"Day by day"}),
      h("span",{class:"eyebrow",text:live().filter(i=>i.day!==null&&i.day!==undefined).length+" placed"})])
  ]);
  for(let d=0; d<t.dayCount; d++){
    (function(d){
      const color = LINES[d%LINES.length];
      const list = dayItems(d);
      const block = h("div",{class:"day",style:{"--line":color}},[
        h("div",{class:"dayhead"},[
          h("span",{class:"daynum",text:"DAY "+(d+1)}),
          h("span",{class:"daydate",text:fmtDay(d,true)}),
          dayCostPP(d) > 0
            ? h("span",{class:"daycost",text:money(dayCostPP(d) * party())})
            : null
        ])
      ]);
      if(!list.length){
        block.appendChild(h("div",{class:"empty"},[
          "Open.",
          h("button",{class:"addhere",onclick:function(){ openComposer(blankDraft(d)); }},
            ["+ Add to Day "+(d+1)])
        ]));
      } else {
        const track = h("div",{class:"track"});
        SLOTS.forEach(function(band){
          const inBand = list.filter(i => i.slot === band.id);
          if(!inBand.length) return;
          track.appendChild(h("p",{class:"band",text:band.label}));
          inBand.forEach(function(i){ track.appendChild(itemCard(i,color,false)); });
        });
        track.appendChild(h("button",{class:"addhere",
          onclick:function(){ openComposer(blankDraft(d)); }},["+ Add to Day "+(d+1)]));
        block.appendChild(track);
      }
      dayNodes[d] = block;
      routePane.appendChild(block);
    })(d);
  }
  cols.appendChild(routePane);
  wrap.appendChild(cols);
  app.appendChild(wrap);

  /* dock */
  app.appendChild(h("div",{class:"dock"},[
    h("button",{class:"btn",onclick:function(){ openComposer(blankDraft(ui.activeDay)); }},
      ["+ Add to trip"]),
    h("button",{class:"btn ghost",onclick:openShare},["Share"])
  ]));

  if(y) se.scrollTop = y;
}

function goToDay(d){
  ui.activeDay = d; ui.pane = "route"; render();
  requestAnimationFrame(function(){
    if(dayNodes[d]) dayNodes[d].scrollIntoView({behavior:"smooth",block:"start"});
  });
}

/* ============================ boot ============================ */
loadLocal();
purgeOld();
applyTheme();
render();

if(connected()){
  pull();
  setInterval(function(){ if(!document.hidden) pull(); }, 120000);
}
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && connected()) pull();
});
window.addEventListener("online", function(){ if(connected()) syncNow(); });

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
